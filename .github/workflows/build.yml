name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      # ── Rust toolchain ──────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Debug Rust environment
        run: |
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Check Rust compilation (host target)
        run: |
          cd rust-core
          cargo check 2>&1 | tee /tmp/cargo-check.log
          exit ${PIPESTATUS[0]}

      - name: Upload cargo check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-log
          path: /tmp/cargo-check.log

      - name: Set up NDK linker for Android target
        run: |
          cd rust-core
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          LLVM_BIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .cargo
          cat > .cargo/config.toml <<CONFIGEOF
          [target.aarch64-linux-android]
          linker = "${LLVM_BIN}/aarch64-linux-android21-clang"
          CONFIGEOF
          cat .cargo/config.toml
          export ANDROID_NDK_HOME="${NDK_PATH}"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Full Android build with cargo-ndk
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          cd rust-core
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          export ANDROID_NDK_HOME="${NDK_PATH}"
          cargo ndk \
            --target arm64-v8a \
            --platform 24 \
            --output-dir "${PWD}/../app/src/main/jniLibs" \
            build --release 2>&1 | tee /tmp/rust-build.log

      - name: Upload Rust build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-build-log
          path: /tmp/rust-build.log

      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks
          cat >> local.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - uses: gradle/actions/setup-gradle@v4

      - name: Build F-Droid Release APK
        run: chmod +x ./gradlew && ./gradlew assembleFdroidRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agora-fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk