name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      # ── Rust toolchain ──────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Debug Rust environment
        run: |
          rustc --version
          cargo --version
          rustup target list --installed
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_SDK_ROOT/ndk/" 2>/dev/null || echo "No NDK found at ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK found at ANDROID_HOME"
          # Check if NDK 28.2.13676358 exists
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          if [ -d "$NDK_PATH" ]; then
            echo "NDK 28.2.13676358 found at $NDK_PATH"
            ls -la "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -20
          else
            echo "NDK 28.2.13676358 NOT found at $NDK_PATH"
            # Try to find any NDK
            find "$ANDROID_SDK_ROOT" -name "aarch64-linux-android21-clang" 2>/dev/null | head -5
          fi

      - name: Check Rust compilation (host target)
        run: |
          cd rust-core
          cargo check 2>&1 || true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust native library (agora_rs)
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          cd rust-core

          # Find NDK
          NDK_PATH=""
          for p in "$ANDROID_SDK_ROOT/ndk/28.2.13676358" "$ANDROID_HOME/ndk/28.2.13676358"; do
            if [ -d "$p" ]; then
              NDK_PATH="$p"
              break
            fi
          done
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk/"*/ 2>/dev/null | sort -V | tail -1)
            NDK_PATH=${NDK_PATH%/}
          fi
          echo "Using NDK: ${NDK_PATH}"

          # Set up the linker config
          LLVM_BIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .cargo
          cat > .cargo/config.toml <<CONFIGEOF
          # CI-generated config
          [target.aarch64-linux-android]
          linker = "${LLVM_BIN}/aarch64-linux-android21-clang"

          [target.armv7-linux-androideabi]
          linker = "${LLVM_BIN}/armv7a-linux-androideabi21-clang"

          [target.x86_64-linux-android]
          linker = "${LLVM_BIN}/x86_64-linux-android21-clang"

          [target.i686-linux-android]
          linker = "${LLVM_BIN}/i686-linux-android21-clang"
          CONFIGEOF
          cat .cargo/config.toml

          export ANDROID_NDK_HOME="${NDK_PATH}"

          # Build with cargo-ndk, capturing output
          cargo ndk \
            --target arm64-v8a \
            --platform 24 \
            --output-dir "${PWD}/../app/src/main/jniLibs" \
            build --release 2>&1 | tee /tmp/rust-build.log

          echo "Build exit code: $?"
          ls -la "${PWD}/../app/src/main/jniLibs/arm64-v8a/libagora_rs.so" 2>/dev/null || echo "ERROR: .so not found!"

      - name: Upload Rust build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-build-log
          path: /tmp/rust-build.log

      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks
          cat >> local.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - uses: gradle/actions/setup-gradle@v4

      - name: Build F-Droid Release APK
        run: chmod +x ./gradlew && ./gradlew assembleFdroidRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agora-fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk