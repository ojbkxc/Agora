name: Release APK

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up NDK linker for Android target
        run: |
          cd rust-core
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          LLVM_BIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .cargo
          cat > .cargo/config.toml <<CONFIGEOF
          [target.aarch64-linux-android]
          linker = "${LLVM_BIN}/aarch64-linux-android21-clang"
          CONFIGEOF
          export ANDROID_NDK_HOME="${NDK_PATH}"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust core (arm64-v8a)
        env:
          RUST_BACKTRACE: "1"
        run: |
          cd rust-core
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          export ANDROID_NDK_HOME="${NDK_PATH}"
          cargo ndk --target arm64-v8a --platform 24 --output-dir "${PWD}/../app/src/main/jniLibs" build --release

      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks
          cat >> local.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Release APKs (fdroid + play)
        run: chmod +x ./gradlew && ./gradlew assembleFdroidRelease assemblePlayRelease

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ inputs.release-tag }}" ]; then
            echo "name=${{ inputs.release-tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/outputs/apk/play/release/*.apk
          generate_release_notes: true
